name: Sanet Transport Libraries
on:
  push:
    branches:
      - main
  pull_request:

  workflow_dispatch:
env:
  NuGetDirectory: ${{ github.workspace}}/nuget

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run Rx Tests
        run: dotnet test tests/Sanet.Transport.Rx.Tests/Sanet.Transport.Rx.Tests.csproj /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:ExcludeByAttribute=GeneratedCodeAttribute /p:Include=[Sanet.Transport.Rx]*

      - name: Run Channel Tests
        run: dotnet test tests/Sanet.Transport.Channel.Tests/Sanet.Transport.Channel.Tests.csproj /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:ExcludeByAttribute=GeneratedCodeAttribute /p:Include=[Sanet.Transport.Channel]*

      - name: Run SignalR Server Tests
        run: dotnet test tests/Sanet.Transport.SignalR.Tests/Sanet.Transport.SignalR.Tests.csproj /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:ExcludeByAttribute=GeneratedCodeAttribute /p:Include=[Sanet.Transport.SignalR.Client]* /p:Include=[Sanet.Transport.SignalR.Server]* /p:Exclude="[Sanet.Transport.SignalR.Client]*Discovery/UdpClientFactory.cs"

      - name: Run Relay Client SDK Tests
        run: dotnet test tests/Sanet.Transport.SignalR.Client.Relay.Tests/Sanet.Transport.SignalR.Client.Relay.Tests.csproj /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:ExcludeByAttribute=GeneratedCodeAttribute /p:Include=[Sanet.Transport.SignalR.Client.Relay]*

      - name: Upload test results
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: tests/Sanet.Transport.Rx.Tests/coverage.opencover.xml,tests/Sanet.Transport.Channel.Tests/coverage.opencover.xml,tests/Sanet.Transport.SignalR.Tests/coverage.opencover.xml,tests/Sanet.Transport.SignalR.Client.Relay.Tests/coverage.opencover.xml
  
  
  publish-nuget:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # OIDC token exchange, required by NuGet Trusted Publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
        
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Create nuget packages
        run: |
          dotnet pack src/Sanet.Transport/Sanet.Transport.csproj --configuration Release --output ${{ env.NuGetDirectory }}
          dotnet pack src/Sanet.Transport.Rx/Sanet.Transport.Rx.csproj --configuration Release --output ${{ env.NuGetDirectory }}
          dotnet pack src/Sanet.Transport.Channel/Sanet.Transport.Channel.csproj --configuration Release --output ${{ env.NuGetDirectory }}
          dotnet pack src/Sanet.Transport.SignalR.Client/Sanet.Transport.SignalR.Client.csproj --configuration Release --output ${{ env.NuGetDirectory }}
          dotnet pack src/Sanet.Transport.SignalR.Server/Sanet.Transport.SignalR.Server.csproj --configuration Release --output ${{ env.NuGetDirectory }}
          dotnet pack src/Sanet.Transport.SignalR.Client.Relay/Sanet.Transport.SignalR.Client.Relay.csproj --configuration Release --output ${{ env.NuGetDirectory }}

      # Trusted Publishing (OIDC) instead of a long-lived API key: nuget.org
      # exchanges this run's OIDC identity for a short-lived (~1 hour) push key,
      # scoped by the trust policy configured for this repository + workflow on
      # the NuGet side. No secret is involved.
      #
      # Deliberately the step right before the push: the exchanged key is only
      # valid for one hour.
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet packages
        env:
          NUGET_APIKEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=("${{ env.NuGetDirectory }}"/*.nupkg)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::No .nupkg found in ${{ env.NuGetDirectory }} - the pack step produced nothing to publish"
            exit 1
          fi
          for file in "${packages[@]}"; do
            dotnet nuget push "$file" --api-key "$NUGET_APIKEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
